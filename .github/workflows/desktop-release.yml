name: desktop-release

# Desktop app installers on release tags (docs/plan/09 sections 3 and 7,
# docs/plan/11 M2: "release 0.2 with unsigned DMG, NSIS/MSI and AppImage").
# release.yml, which dist generates for the CLI, creates the GitHub release for
# a tag vX.Y.Z; this workflow builds the desktop app for the same tag and adds
# its installers to that release. It is a separate file because release.yml is
# dist's output and scripts/release-workflow.py --check keeps it that way.
#
# 1. version: the tag must equal the workspace version, which the desktop app
#    carries (scripts/desktop-version.py; tauri.conf.json has no version of
#    its own). Desktop tags are plain X.Y.Z: an MSI allows no pre-release
#    suffix, so this workflow starts only on tags without one.
# 2. wasm: builds the core once (cargo xtask wasm, the pinned wasm-bindgen
#    CLI), as the desktop job of ci.yml does; every row bundles the same files.
# 3. bundle: one row per desktop OS, each building the playground and the app
#    with the Tauri CLI that apps/desktop pins (2.12.4):
#      - ubuntu-24.04: .deb and .rpm (x86-64; glibc 2.39 and WebKitGTK 4.1);
#      - windows-2025: NSIS .exe and .msi (x86-64);
#      - macos-26: one universal (Apple silicon and Intel) .dmg, and the same
#        .app as .app.tar.gz.
#    No AppImage: it would copy LGPL system libraries (WebKitGTK, GTK, GLib)
#    into the file, a licence decision a maintainer has not made yet
#    (apps/desktop/README.md). Nothing is signed: macOS gets only the ad-hoc
#    signature that Apple silicon needs to run a program at all
#    (tauri.conf.json bundle.macOS.signingIdentity "-"), and Windows nothing;
#    real signing comes in M4. Each row writes a .sha256 file per installer
#    and keeps everything as a workflow artifact for 14 days.
# 4. publish (tag pushes only): a GitHub artifact attestation for every file,
#    as release.yml makes for the CLI; then it waits until release.yml has
#    created the release (up to 90 minutes), uploads the files with
#    desktop-sha256.sum, and adds a short desktop section to the release
#    notes once. It never creates the release itself, so dist's own
#    `gh release create` cannot find one in its way.
#
# Run it by hand (Actions > desktop-release > Run workflow) for a dry run: it
# builds every installer and keeps them as artifacts, uploads nothing and
# attests nothing. If a tag run's publish job timed out because the CLI
# release failed, re-run that job once the release exists.
#
# Actions are pinned by commit like release.yml's: checkout, upload-artifact,
# download-artifact and attest are the commits dist-workspace.toml pins;
# setup-node v4.4.0 and pnpm/action-setup v4.4.0 (the majors ci.yml uses)
# were resolved with `git ls-remote --tags` on 2026-11-01. No caches: a
# release build starts clean. Only publish gets `contents: write`, and only
# on a tag push. scripts/desktop-version.py --check-workflow (ci.yml, job
# release) keeps these promises.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: The app's version is the workspace version (and the tag's)
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 -I scripts/desktop-version.py --check --tag "$GITHUB_REF_NAME"
          else
            python3 -I scripts/desktop-version.py --check
          fi
          echo "version=$(python3 -I scripts/desktop-version.py)" >> "$GITHUB_OUTPUT"

  wasm:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Rust (rust-toolchain.toml) with the wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: The wasm-bindgen CLI pinned in Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)
          cargo install wasm-bindgen-cli --version "=${version}" --locked
      - name: Build the core (wasm-bindgen --target web)
        run: cargo xtask wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-wasm
          path: apps/web/src/wasm/
          if-no-files-found: error
          retention-days: 1

  bundle:
    name: bundle (${{ matrix.name }})
    needs: [version, wasm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            bundles: deb,rpm
            target: ""
            out: target/release/bundle
          - name: windows-x64
            os: windows-2025
            bundles: nsis,msi
            target: ""
            out: target/release/bundle
          - name: macos-universal
            os: macos-26
            bundles: app,dmg
            target: universal-apple-darwin
            out: target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUNDLES: ${{ matrix.bundles }}
      TARGET: ${{ matrix.target }}
      OUT: ${{ matrix.out }}
    steps:
      - name: enable windows longpaths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Linux packages for Tauri (WebKitGTK 4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libsoup-3.0-dev
      - name: Rust targets for the universal macOS app
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: The core built by the wasm job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-wasm
          path: apps/web/src/wasm/
      - name: Build the app and its installers (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          args=(--bundles "$BUNDLES")
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          pnpm --dir apps/desktop tauri build "${args[@]}"
      - name: Collect the installers with their SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop-out
          case "$RUNNER_OS" in
            Linux)
              cp "$OUT"/deb/*.deb "$OUT"/rpm/*.rpm desktop-out/
              # The package version comes from the workspace (Cargo.toml).
              test "$(dpkg-deb -f desktop-out/*.deb Version)" = "$VERSION"
              ;;
            Windows)
              cp "$OUT"/nsis/*-setup.exe "$OUT"/msi/*.msi desktop-out/
              ;;
            macOS)
              cp "$OUT"/dmg/*.dmg desktop-out/
              app="$OUT/macos/OpenBrick3D.app"
              # Ad-hoc signed only: Apple silicon runs no unsigned program.
              codesign --verify --deep --strict "$app"
              codesign -dv "$app" 2>&1 | grep -q '^Signature=adhoc$'
              test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
              lipo -archs "$app/Contents/MacOS/openbrick-desktop" | grep -q arm64
              lipo -archs "$app/Contents/MacOS/openbrick-desktop" | grep -q x86_64
              tar -czf "desktop-out/OpenBrick3D_${VERSION}_universal.app.tar.gz" -C "$OUT/macos" OpenBrick3D.app
              ;;
          esac
          cd desktop-out
          count=0
          for f in *; do
            case "$f" in *"$VERSION"*) ;; *) echo "::error::$f does not carry the version $VERSION"; exit 1 ;; esac
            if command -v sha256sum > /dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
            count=$((count + 1))
          done
          test "$count" -eq 2
          {
            echo "### Desktop installers (${{ matrix.name }}, unsigned)"
            echo
            echo "| File | Bytes | SHA-256 |"
            echo "|------|-------|---------|"
            for f in *.sha256; do
              name="${f%.sha256}"
              echo "| \`$name\` | $(wc -c < "$name" | tr -d ' ') | \`$(cut -d' ' -f1 "$f")\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-bundle-${{ matrix.name }}
          path: desktop-out/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [version, bundle]
    # Tag pushes only: a manual run is a dry run and uploads nothing.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-bundle-*
          path: desktop-out/
          merge-multiple: true
      - name: One checksum list for all installers
        working-directory: desktop-out
        run: |
          set -euo pipefail
          cat *.sha256 > desktop-sha256.sum
          sha256sum -c desktop-sha256.sum
          ls -l
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            desktop-out/*
      - name: Wait for the release that release.yml creates
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null 2>&1; then
              echo "release $TAG found"
              exit 0
            fi
            echo "release $TAG not there yet ($i/90); waiting a minute"
            sleep 60
          done
          echo "::error::release.yml has not created the release $TAG after 90 minutes. The installers are kept as artifacts of this run; re-run this job once the release exists."
          exit 1
      - name: Upload the installers and checksums
        run: gh release upload "$TAG" desktop-out/* --clobber --repo "$GITHUB_REPOSITORY"
      - name: Add the desktop section to the release notes (once)
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          if grep -q '<!-- desktop-alpha -->' "$RUNNER_TEMP/notes.md"; then exit 0; fi
          guide="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$TAG/docs/guides/install.md#desktop-app-alpha"
          cat >> "$RUNNER_TEMP/notes.md" <<EOF

          <!-- desktop-alpha -->
          ## Desktop app (alpha, unsigned)

          Installers for the desktop app: \`.dmg\` (macOS 13 or later, Apple silicon and Intel), \`-setup.exe\` and \`.msi\` (Windows 10 and 11, x86-64), \`.deb\` and \`.rpm\` (Linux x86-64). They are not code-signed yet (signing comes in M4), so macOS and Windows ask you to confirm the first start; the [install guide]($guide) shows how, step by step. Check a download with \`desktop-sha256.sum\` or \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`.
          EOF
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
