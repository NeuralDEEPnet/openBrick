name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -q -p xtask -- data
      - run: cargo run -q -p openbrick -- check parts/ndn.logo-tile.obpart.json
      - run: cargo run -q -p openbrick -- check parts/ndn.nameplate-keychain.obpart.json
      - run: cargo run -q -p openbrick -- check parts/ndn.brand-tile.obpart.json
      - run: cargo run -q -p openbrick -- check parts/ndn.brand-badge.obpart.json

  test-cross:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo run -q -p openbrick -- standard

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the kernel WebAssembly probe
        run: cargo build --release --target wasm32-unknown-unknown -p openbrick-geom --example wasm_probe
      - name: Run the probe and check it matches the native fingerprint
        run: |
          out=$(node scripts/wasm-probe.mjs target/wasm32-unknown-unknown/release/examples/wasm_probe.wasm)
          echo "$out"
          native=$(cargo run -q --release -p openbrick-geom --example kernel_timing | awk '$1=="2x4"{print $5}')
          echo "native 2x4 fingerprint: $native"
          echo "$out" | grep -q "\"fingerprint\":\"$native\""

  deny:
    # Licence allowlist, bans, advisories and sources (LICENSE-POLICY.md, deny.toml).
    # Covers every feature, including the optional manifold-csg backend. The C++
    # sources that manifold-csg-sys clones at build time are outside Cargo's view;
    # see docs/spikes/q01b-manifold-csg-comparison.md.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features
          command: check

  geom-manifold-csg:
    # Second kernel backend (C++ Manifold through manifold-csg) and the
    # cross-backend conformance comparison; see
    # docs/spikes/q01b-manifold-csg-comparison.md. The first build clones Manifold
    # and Clipper2 from GitHub and compiles them with cmake and g++, which
    # ubuntu-24.04 runners already have; rust-cache keeps the build afterwards.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy with both kernel backends
        run: cargo clippy -p openbrick-geom --all-targets --features manifold-csg -- -D warnings
      - name: Conformance corpus on both backends
        run: cargo test -p openbrick-geom --features manifold-csg
      - name: Print the cross-backend comparison table
        run: cargo test -p openbrick-geom --features manifold-csg --test conformance backends_agree -- --nocapture
      - name: Corpus on manifold-csg alone
        run: cargo test -p openbrick-geom --no-default-features --features manifold-csg

  harness:
    # Device render harness (bench/harness): unit tests, including the results.csv
    # guard, and a headless smoke run. Smoke numbers are software rendering, never
    # device results. The committed meshes are checked against the kernel by cargo
    # test in the check job (crates/openbrick-geom/tests/harness_meshes.rs).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests, including the results.csv guard
        run: pnpm test
      - name: Install Chromium for the pinned Playwright (1.63.0)
        run: pnpm --dir bench/harness exec playwright install --with-deps chromium
      - name: Smoke test (software rendering, not a device result)
        run: pnpm --dir bench/harness smoke

  io-3mf:
    # 3MF and STL writers (crates/openbrick-io, backlog items 12 and 13, decision
    # D18). The write_fixtures example writes a kernel-built 2x4 brick with an
    # accent cube and a three-role fixture. lib3mf 2.5.0 (BSD-2-Clause, the 3MF
    # Consortium reference library) reads every file in strict mode; the script
    # re-derives every Production UUID from what lib3mf read and compares the
    # files with the example's manifest. --self-test checks that broken copies
    # fail for the reason they were built to show. lib3mf ships Linux wheels for
    # x86-64 only, so this job stays on ubuntu-24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lib3mf 2.5.0 (hash-pinned)
        run: python -m pip install --require-hashes -r scripts/requirements-validate-3mf.txt
      - name: Write the 3MF and STL fixtures
        run: cargo run -q --release -p openbrick-io --example write_fixtures -- target/io-fixtures
      - name: Validate the fixtures with lib3mf
        run: python -I scripts/validate-3mf.py --self-test target/io-fixtures/fixtures.json
      - name: The writers build for WebAssembly
        run: cargo build --release --target wasm32-unknown-unknown -p openbrick-io
      - name: Keep the fixtures for inspection in slicers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: io-fixtures
          path: target/io-fixtures/
          retention-days: 14

  web:
    # Browser playground (apps/web): the core as WebAssembly in a Web Worker and
    # the three.js viewer. Builds the core with the wasm-bindgen CLI pinned in
    # Cargo.lock (size budget, docs/plan/10 section 5) and runs every pnpm unit
    # test, including the real core in Node. The headless smoke test then checks
    # that the logo tile (emboss, deboss, the filament-swap and the parts inlay,
    # no fit profile) and the coupon equal `cargo run --release -p
    # openbrick-wasm --example native_eval` (the same Rust functions natively),
    # and that every downloaded file (emboss 3MF and STL, the face-down swap and
    # parts inlay 3MFs, coupon 3MF) is byte-identical to the native export, each
    # part 3MF in the part-designer layout (one build item, one components
    # object with a part per colour role). It also checks that the inlay style
    # shows only for an inlay and that the two inlays download under different
    # names, that FIT.MISSING disables the downloads, that a reply for controls
    # that changed meanwhile is dropped, that a refused build empties the view,
    # that a slow 16x16 evaluation is cancelled, that the view orbits under the
    # part, a phone-sized touch run, and the GitHub Pages build under
    # /openBrick/. lib3mf 2.5.0 then reads every downloaded 3MF in strict mode,
    # with the component self-test on the first part 3MF. Smoke timings are
    # software rendering, never device results. lib3mf ships Linux wheels for
    # x86-64 only, so this job stays on ubuntu-24.04. test/core.test.js still
    # compares the core's nominal 2x4 brick with the harness meshes in Node.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen version pinned in Cargo.lock
        id: wbg
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - name: Cache the wasm-bindgen CLI
        id: wbg-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.wbg.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install the wasm-bindgen CLI
        if: steps.wbg-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "=${{ steps.wbg.outputs.version }}" --locked
      - name: Clippy on wasm32 (the bindings exist only there)
        run: cargo clippy -p openbrick-wasm --target wasm32-unknown-unknown -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lib3mf 2.5.0 (hash-pinned)
        run: python -m pip install --require-hashes -r scripts/requirements-validate-3mf.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the core (wasm-bindgen --target web, gzip size budget)
        run: cargo xtask wasm
      - name: Unit tests, including the real core in Node
        run: pnpm test
      - name: Install Chromium for the pinned Playwright (1.63.0)
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Smoke test (software rendering, not a device result)
        run: pnpm --dir apps/web smoke --screenshots smoke-screenshots
      - name: Validate the downloaded 3MF files with lib3mf (strict)
        run: python -I scripts/validate-3mf.py --self-test apps/web/smoke-downloads/*.3mf
      - name: Keep what the smoke runs saw and downloaded
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke
          path: |
            apps/web/smoke-screenshots
            apps/web/smoke-downloads
          if-no-files-found: ignore
          retention-days: 14

  part-exports:
    # Printable exports of the part crate, read back by lib3mf 2.5.0 in strict
    # mode: manifold, consistently oriented meshes, traceability metadata,
    # re-derived Production UUIDs, sampled overlaps.
    # - relief.svg (backlog item 9): the 2x4 logo tile's body and embossed relief
    #   (two touching objects), and its fused single-colour object.
    # - The multi-material layout (Q18): emboss, the parts inlay of the square
    #   and of the example mark, each as one components object with two parts.
    #   Colourless copies of the first two are for the slicer import check of
    #   Bambu's colour dialog (docs/spikes/q18-slicer-multimaterial-import.md):
    #   square test artwork, no fit profile, design orientation, so never for
    #   the pull test; a printable colourless tile comes from
    #   `openbrick build --no-colour` (docs/guides/print-test.md section 6).
    #   The CLI's and the playground's inlays are turned face down; these are not.
    # - Calibration coupon (backlog item 11, docs/plan/05 section 4): the default
    #   fdm-0.4 coupon, the fdm-0.2 coupon, and the full pocket cross on a
    #   256 x 256 mm bed.
    # The hostile-SVG tests (1 MiB stack, timed refusals) run with the workspace
    # tests. lib3mf ships Linux wheels for x86-64 only.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lib3mf 2.5.0 (hash-pinned)
        run: python -m pip install --require-hashes -r scripts/requirements-validate-3mf.txt
      - name: Write the logo tile exports
        run: |
          mkdir -p target/relief-exports
          OPENBRICK_RELIEF_EXPORT_DIR="$PWD/target/relief-exports" cargo test -q -p openbrick-part --test eval_relief -- relief_objects_export_as_closed_meshes multi_material_exports_are_one_object_with_parts
      - name: Build the coupons
        run: |
          cargo run -q --release -p openbrick-part --example coupon -- target/coupon
          cargo run -q --release -p openbrick-part --example coupon -- --process fdm-0.2 target/coupon
          cargo run -q --release -p openbrick-part --example coupon -- --pockets full --bed 256x256 target/coupon
      - name: Validate every export with lib3mf
        run: >-
          python -I scripts/validate-3mf.py --self-test
          target/relief-exports/logo-tile-two-colour.3mf target/relief-exports/logo-tile-fused.3mf
          target/relief-exports/logo-tile-emboss-parts.3mf target/relief-exports/logo-tile-inlay-parts.3mf
          target/relief-exports/logo-tile-mark-inlay-parts.3mf
          target/relief-exports/logo-tile-emboss-parts-no-colour.3mf target/relief-exports/logo-tile-inlay-parts-no-colour.3mf
          target/coupon/coupon-fdm-0.4-cross.3mf target/coupon/coupon-fdm-0.2-cross.3mf target/coupon/coupon-fdm-0.4-full.3mf
      - name: The evaluator and the coupon build for WebAssembly
        run: cargo build --release --target wasm32-unknown-unknown -p openbrick-part
      - name: Release timing of the logo tile
        run: cargo run -q --release -p openbrick-part --example eval_timing -- 2x4:tile logo logo:deboss logo:inlay logo:inlay-parts
      - name: Keep the exports for printing and slicer checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-exports
          path: |
            target/relief-exports/
            target/coupon/
          retention-days: 14

  cli:
    # The openbrick CLI end to end (backlog items 11 and 14, docs/plan/05
    # sections 4, 7 and 9, docs/guides/print-test.md). Installs the CLI from the
    # clone as the guide does and builds the 2x4 logo tile from its sample SVG:
    # emboss, deboss, the filament-swap inlay, the multi-material inlay
    # (inlayStyle=parts) with and without display colours (--no-colour, for
    # Bambu Studio's import colour dialog, Q18) and a brick-height inlay as 3MF
    # in the part-designer layout (one object whose parts are the colour roles,
    # Q18), the fused tile as STL and as 3MF, the Neuraldeep.net demo tile as a
    # parts inlay and the Neuraldeep.net badge (their artwork is in
    # parts/assets/brand/, all rights reserved, see its NOTICE.md), the default
    # fdm-0.4 coupon with its manifest; records a fit profile and builds with
    # it; and checks that a blocked build exits 1 and writes nothing. lib3mf
    # 2.5.0 reads every file in strict mode and the script compares each one
    # with what the CLI's --json says it wrote (layout, components object,
    # objects, colours, UUIDs, metadata); --self-test also breaks copies of the
    # files and of their descriptions. That the CLI and the playground write the
    # same meshes, with and without colours, is checked by cargo test in the
    # check job (crates/openbrick/tests/export_parity.rs). lib3mf ships Linux
    # wheels for x86-64 only, so this job stays on ubuntu-24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lib3mf 2.5.0 (hash-pinned)
        run: python -m pip install --require-hashes -r scripts/requirements-validate-3mf.txt
      - name: Install the CLI from the clone, as the print-test guide does
        run: cargo install --path crates/openbrick --locked --root target/cli-install
      - name: Build the logo tile and the coupon with the CLI
        run: |
          set -euo pipefail
          ob=target/cli-install/bin/openbrick
          out=target/cli-exports
          mkdir -p "$out"
          for relief in emboss deboss inlay; do
            $ob build parts/ndn.logo-tile.obpart.json --fit example --param relief=$relief \
              --out "$out/logo-tile-$relief.3mf" --json > "$out/logo-tile-$relief.json"
          done
          $ob build parts/ndn.logo-tile.obpart.json --fit example --params relief=inlay inlayStyle=parts \
            --out "$out/logo-tile-inlay-parts.3mf" --json > "$out/logo-tile-inlay-parts.json"
          $ob build parts/ndn.logo-tile.obpart.json --fit example --params relief=inlay inlayStyle=parts \
            --no-colour --out "$out/logo-tile-inlay-parts-no-colour.3mf" --json > "$out/logo-tile-inlay-parts-no-colour.json"
          $ob build parts/ndn.logo-tile.obpart.json --fit example --params height=brick relief=inlay \
            --out "$out/logo-tile-inlay-brick.3mf" --json > "$out/logo-tile-inlay-brick.json"
          $ob build parts/ndn.logo-tile.obpart.json --fit example \
            --out "$out/logo-tile-fused.stl" --json > "$out/logo-tile-fused.json"
          $ob build parts/ndn.logo-tile.obpart.json --fit example --fuse \
            --out "$out/logo-tile-fused.3mf" --json > "$out/logo-tile-fused-3mf.json"
          $ob build parts/ndn.brand-tile.obpart.json --fit example --params relief=inlay inlayStyle=parts \
            --out "$out/brand-tile.3mf" --json > "$out/brand-tile.json"
          $ob build parts/ndn.brand-badge.obpart.json --fit example \
            --out "$out/brand-badge.3mf" --json > "$out/brand-badge.json"
          $ob calibrate coupon --process fdm-0.4 \
            --out "$out/coupon-fdm-0.4-cross.3mf" --manifest "$out/coupon-fdm-0.4-cross.json"
          $ob calibrate record --process fdm-0.4 --printer "CI" --material PLA \
            --stud 4.80 --tube 4.95 --pocket 6.65/0.30 --date 2026-10-28 --out "$out/ci-fit.json"
          $ob build parts/ndn.logo-tile.obpart.json --fit "$out/ci-fit.json" \
            --out "$out/logo-tile-recorded-fit.3mf" --json > "$out/logo-tile-recorded-fit.json"
      - name: A fit-critical part without a fit profile is blocked (exit 1, nothing written)
        run: |
          set +e
          target/cli-install/bin/openbrick build parts/ndn.logo-tile.obpart.json \
            --out target/cli-exports/blocked.3mf 2> target/cli-exports/blocked.txt
          code=$?
          set -e
          cat target/cli-exports/blocked.txt
          test "$code" -eq 1
          test ! -e target/cli-exports/blocked.3mf
          grep -q "blocker FIT.MISSING" target/cli-exports/blocked.txt
      - name: Validate every CLI export with lib3mf
        # The emboss tile stays first: --self-test breaks copies of the first
        # file, and its overlap mutation needs a face-up part (it cannot make
        # a face-down parts inlay's fill overlap the body).
        run: >-
          python -I scripts/validate-3mf.py --self-test
          target/cli-exports/logo-tile-emboss.json target/cli-exports/logo-tile-deboss.json
          target/cli-exports/logo-tile-inlay.json target/cli-exports/logo-tile-inlay-parts.json
          target/cli-exports/logo-tile-inlay-parts-no-colour.json
          target/cli-exports/logo-tile-inlay-brick.json target/cli-exports/logo-tile-fused.json
          target/cli-exports/logo-tile-fused-3mf.json target/cli-exports/logo-tile-recorded-fit.json
          target/cli-exports/brand-tile.json target/cli-exports/brand-badge.json
          target/cli-exports/coupon-fdm-0.4-cross.json
      - name: Inputs of the OrcaSlicer smoke test (dry run; slicer-smoke.yml slices them weekly)
        run: |
          python3 -I scripts/slicer-smoke.py self-test
          scripts/slicer-smoke.sh --dry-run --openbrick target/cli-install/bin/openbrick --work target/slicer-smoke
      - name: Release wall time of the CLI
        run: |
          ob=target/cli-install/bin/openbrick
          mkdir -p target/cli-timing
          time $ob build parts/ndn.logo-tile.obpart.json --fit example --out target/cli-timing/tile.3mf > /dev/null
          time $ob build parts/ndn.logo-tile.obpart.json --fit example --params relief=inlay inlayStyle=parts \
            --out target/cli-timing/tile-inlay-parts.3mf > /dev/null
          time $ob calibrate coupon --out target/cli-timing/coupon.3mf > /dev/null
      - name: Keep the exports for printing and slicer checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-exports
          path: target/cli-exports/
          retention-days: 14

  release:
    # The CLI release setup (backlog item 15, decision D15; dist-workspace.toml,
    # docs/guides/install.md), so a broken setup fails here and not when a tag
    # is pushed.
    #
    # On every push and pull request, in a minute or two (nothing is compiled):
    # with the dist version that dist-workspace.toml pins, `dist plan` must
    # succeed and .github/workflows/release.yml must be exactly what
    # scripts/release-workflow.py generates (dist's output plus the edited `on:`
    # block); and README.md, which every release archive ships, must carry the
    # install commands and the attestation check.
    #
    # Only when the change touches the release build (the paths that trigger
    # release.yml, plus Cargo.lock, the files every archive includes and this
    # workflow), or when there is no base commit to compare with: it builds the
    # x86_64 Linux archive and the shell installer as a release job does (the
    # steps of .github/dist-build-setup.yml: registry paths remapped,
    # third-party licence texts collected), installs from that local archive
    # through the installer (file://, nothing is downloaded), runs the
    # installed CLI, checks what the archive holds and that no runner path is
    # left in the binary, and writes the SBOM with the cargo-cyclonedx version
    # dist 0.33.1 uses (0.5.5). That part takes about ten minutes (a thin-LTO
    # release build).
    #
    # dist (MIT OR Apache-2.0) and cargo-cyclonedx (Apache-2.0) are build tools
    # here and in release.yml; neither is shipped. Both come from their GitHub
    # releases by exact version, as release.yml installs them.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The release-build scope below compares with the base commit.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install dist (the version dist-workspace.toml pins)
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 scripts/release-workflow.py --dist-version)
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${version}/cargo-dist-installer.sh" | sh
          dist --version
      - name: dist plan
        run: dist plan
      - name: release.yml is what dist generates from dist-workspace.toml
        run: python3 scripts/release-workflow.py --check
      - name: The README that every archive ships has the install commands
        run: |
          set -euo pipefail
          for s in \
            'https://github.com/NeuralDEEPnet/openBrick/releases/latest/download/openbrick-installer.sh' \
            'https://github.com/NeuralDEEPnet/openBrick/releases/latest/download/openbrick-installer.ps1' \
            'cargo binstall --git https://github.com/NeuralDEEPnet/openBrick openbrick' \
            'gh attestation verify' \
            'docs/guides/install.md'; do
            grep -qF -- "$s" README.md || { echo "README.md lacks: $s (docs/guides/install.md has the text)"; exit 1; }
          done
          if grep -qF 'Nothing is installable yet' README.md; then
            echo "README.md still says nothing is installable"; exit 1
          fi
      - name: Does this change touch the release build?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          paths="$RUNNER_TEMP/release-paths.txt"
          {
            python3 scripts/release-workflow.py --trigger-paths
            printf '%s\n' Cargo.lock README.md LICENSE CHANGELOG.md .github/workflows/ci.yml
          } > "$paths"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2> /dev/null; then
            echo "no base commit to compare with; building to be safe"
            build=true
          else
            git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt"
            if grep -xF -f "$paths" "$RUNNER_TEMP/changed.txt"; then
              build=true
            else
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "release build, install and SBOM: $build"
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.build == 'true'
      - name: Build the Linux archive and the shell installer as a release job does
        if: steps.scope.outputs.build == 'true'
        run: |
          set -euo pipefail
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          python3 scripts/third-party-licenses.py target/THIRD-PARTY-LICENSES.txt
          RUSTFLAGS="--remap-path-prefix=${cargo_home}=/cargo" \
            dist build --target x86_64-unknown-linux-gnu --artifacts=all
      - name: Install from the local archive with the shell installer, then run it
        if: steps.scope.outputs.build == 'true'
        run: |
          set -euo pipefail
          OPENBRICK_DOWNLOAD_URL="file://$PWD/target/distrib" \
            OPENBRICK_UNMANAGED_INSTALL="$RUNNER_TEMP/openbrick" \
            sh target/distrib/openbrick-installer.sh
          ob="$RUNNER_TEMP/openbrick/openbrick"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          test "$("$ob" --version)" = "openbrick $version"
          "$ob" about > /dev/null
          "$ob" build parts/ndn.logo-tile.obpart.json --fit example --out "$RUNNER_TEMP/tile.3mf"
          test -s "$RUNNER_TEMP/tile.3mf"
          tar -tJf target/distrib/openbrick-x86_64-unknown-linux-gnu.tar.xz > "$RUNNER_TEMP/contents.txt"
          cat "$RUNNER_TEMP/contents.txt"
          for f in openbrick README.md LICENSE CHANGELOG.md THIRD-PARTY-LICENSES.txt; do
            grep -qx "openbrick-x86_64-unknown-linux-gnu/$f" "$RUNNER_TEMP/contents.txt"
          done
          if grep -qF "${CARGO_HOME:-$HOME/.cargo}" "$ob"; then
            echo "the runner's cargo folder is still in the binary"; exit 1
          fi
      - name: SBOM with the cargo-cyclonedx version dist uses
        if: steps.scope.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-0.5.5/cargo-cyclonedx-installer.sh | sh
          cargo cyclonedx -v
          python3 -I -c 'import sys, xml.etree.ElementTree as ET; ns = {"c": "http://cyclonedx.org/schema/bom/1.3"}; bom = ET.parse(sys.argv[1]).getroot(); n = len(bom.findall("c:components/c:component", ns)); print(n, "components"); sys.exit(0 if n > 0 else 1)' crates/openbrick/openbrick.cdx.xml
      - name: Keep the archive, the installer and the SBOM
        if: always() && steps.scope.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: |
            target/distrib/*.tar.xz
            target/distrib/*.sha256
            target/distrib/sha256.sum
            target/distrib/openbrick-installer.sh
            crates/openbrick/openbrick.cdx.xml
          if-no-files-found: ignore
          retention-days: 14

  desktop:
    # Desktop app alpha (apps/desktop): the playground in a Tauri 2 window with
    # native open and save dialogs (docs/plan/09 sections 1 to 4, D13). Builds
    # the core (cargo xtask wasm), checks the openbrick-desktop crate with its
    # Tauri feature (clippy, tests; the file rules also run in check and
    # test-cross through cargo test --workspace), runs the configuration tests
    # (node --test: CSP, permissions, window, pins), builds the debug app and
    # runs the smoke test: the debug app under Xvfb, driven by tauri-driver
    # 2.1.0 and WebKitWebDriver. It checks that the first tile equals
    # native_eval and is shown in the 3D view, that the Content Security Policy
    # is in force, that Download 3MF, Download STL and the coupon 3MF write
    # files byte-identical to native_eval's exports through the app's save
    # command (the coupon 3MF also over Tauri's postMessage IPC fallback),
    # that an SVG and a fit profile open through the open command, and
    # that a file over the core's limit is refused before it is read. On main
    # it also bundles an unsigned .deb and keeps it as an artifact. No AppImage
    # yet: it would copy system libraries under the LGPL (WebKitGTK, GTK, GLib)
    # into the file, which needs their notices and a source offer and is a
    # licence decision for a maintainer (apps/desktop/README.md). The macOS and
    # Windows compile checks are in desktop-cross; their bundles come with the
    # release workflow (docs/plan/09 section 7).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages for Tauri (WebKitGTK 4.1) and the smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libsoup-3.0-dev webkit2gtk-driver xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen version pinned in Cargo.lock
        id: wbg
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - name: Cache the wasm-bindgen CLI and tauri-driver
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/tauri-driver
          key: desktop-tools-wasm-bindgen-${{ steps.wbg.outputs.version }}-tauri-driver-2.1.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install the wasm-bindgen CLI and tauri-driver
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install wasm-bindgen-cli --version "=${{ steps.wbg.outputs.version }}" --locked
          cargo install tauri-driver --version =2.1.0 --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the core (wasm-bindgen --target web)
        run: cargo xtask wasm
      - name: Clippy and tests of the desktop crate with the Tauri app
        run: |
          cargo clippy -p openbrick-desktop --features app --all-targets -- -D warnings
          cargo test -p openbrick-desktop --features app
      - name: Configuration tests (node --test)
        run: pnpm --dir apps/desktop test
      - name: Build the debug app (no bundle)
        run: pnpm --dir apps/desktop build:debug
      - name: Smoke test under Xvfb (tauri-driver and WebKitWebDriver; software rendering)
        run: xvfb-run -a -s "-screen 0 1600x1000x24" pnpm --dir apps/desktop smoke --no-build --screenshots smoke-screenshots
      - name: Bundle the unsigned .deb (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm --dir apps/desktop tauri build --bundles deb
      - name: Keep the smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke
          path: apps/desktop/smoke-screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep the Linux .deb
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-deb-unsigned
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

  desktop-cross:
    # The Tauri app (feature `app` of openbrick-desktop) compiled, linted and
    # tested on Windows and macOS on every pull request, so app.rs and main.rs
    # (the Windows subsystem attribute, the dialog and opener calls, the
    # Linux-only safe rendering block) are not first compiled at release time.
    # A dev build of a Tauri app embeds no frontend (tauri-codegen 2.7.4,
    # src/context.rs: with devUrl set it uses empty assets), so this job needs
    # neither the wasm core nor the web build, and on these OSes no system
    # packages either (WebView2 and WKWebView come with the OS; the WebView2
    # loader is linked statically on MSVC). The tests are the navigation guard
    # and the save body checks; the file rules also run in test-cross. Linux is
    # covered by the desktop job. Bundles for these OSes come from the release
    # workflow (docs/plan/09 section 7); tauri-action builds on pull requests
    # (docs/plan/10 section 5, desktop-bundles) can replace this job later.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy of the desktop crate with the Tauri app
        run: cargo clippy -p openbrick-desktop --features app --all-targets -- -D warnings
      - name: Tests of the desktop crate with the Tauri app
        run: cargo test -p openbrick-desktop --features app

# Note for release.yml (docs/plan/09 section 7; not written here): on tags
# vX.Y.Z add a `desktop` matrix job next to the dist jobs, unsigned until M4.
# Matrix, one row per tier-1 desktop target of plan 09 section 1:
#   - ubuntu-22.04 (Linux x64; the oldest glibc and WebKitGTK 4.1 for the
#     packages): `--bundles deb,rpm`; same apt packages as the desktop job,
#     without webkit2gtk-driver and xvfb.
#   - ubuntu-22.04-arm (Linux arm64, native runner; cross-compiling
#     against WebKitGTK would need an arm64 sysroot): `--bundles deb,rpm`,
#     same packages.
#     No AppImage on either Linux row until a maintainer has made the licence
#     decision in apps/desktop/README.md (notices and a source offer for the
#     LGPL libraries it copies in); plan 09 lists AppImage, so this is a
#     deferral, not a removal.
#   - windows-2025 (Windows x64): NSIS and MSI.
#   - windows-11-arm (Windows arm64, native runner, or windows-2025 with
#     `--target aarch64-pc-windows-msvc` and the MSVC arm64 build tools):
#     NSIS; check whether tauri-bundler's WiX path supports arm64 MSI before
#     adding `msi` to that row.
#   - macos-26 with `--target aarch64-apple-darwin` and
#     `--target x86_64-apple-darwin` (DMG; or one universal-apple-darwin
#     build).
# Steps: checkout; Rust stable with wasm32-unknown-unknown (plus the row's
# target); the pinned wasm-bindgen CLI; pnpm install --frozen-lockfile;
# cargo xtask wasm (scripts/frontend.mjs refuses to build without
# apps/web/src/wasm/); then tauri-apps/tauri-action (pin it by commit SHA)
# with `projectPath: apps/desktop`, `tauriScript: pnpm tauri`, `args:` the
# row's `--target` and `--bundles`, `tagName: ${{ github.ref_name }}`,
# `releaseDraft: true`, `includeUpdaterJson: false`, and no APPLE_*,
# TAURI_SIGNING_* or Windows signing secrets (unsigned; the updater plugin
# and its key come in M4 with signing, docs/plan/09 sections 3 and 4).
# Permissions: contents: write for that job only. The release notes say the
# desktop builds are unsigned and how to open them (README of apps/desktop).

  docs:
    # Plan links, then the documentation site (docs/site, backlog item 16,
    # docs/plan/10 section 7). `cargo xtask docs --check`:
    # - fails when the committed CLI reference (docs/site/src/cli.md,
    #   generated from the openbrick command's --help) is out of date;
    # - stages docs/guides, docs/plan and docs/spikes beside docs/site/src: a
    #   link to a file that does not exist fails, links to other repository
    #   files become GitHub links, every page must be in SUMMARY.md, and every
    #   page gets a footer with its source link and the disclaimer;
    # - checks that the credits page names the pinned mdBook (MPL-2.0; its
    #   front-end files ship with the site);
    # - builds the site with the mdBook version pinned in crates/xtask/src/docs.rs;
    # - checks every relative link, every #anchor and every page footer in
    #   the HTML.
    # The pages workflow publishes the same build at
    # https://neuraldeepnet.github.io/openBrick/docs/.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check plan links
        run: |
          python3 - <<'EOF'
          import re,os,glob,sys
          bad=0
          for f in glob.glob('docs/plan/*.md')+glob.glob('docs/spikes/*.md'):
              for m in re.finditer(r'\]\(([^)]+)\)', open(f).read()):
                  t=m.group(1)
                  if t.startswith(('http','#')): continue
                  p=os.path.join(os.path.dirname(f), t.split('#')[0])
                  if not os.path.exists(p): print('broken', f, t); bad+=1
          sys.exit(1 if bad else 0)
          EOF
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: mdBook version pinned by cargo xtask docs
        id: mdbook
        run: echo "version=$(cargo xtask docs --mdbook-version)" >> "$GITHUB_OUTPUT"
      - name: Cache mdBook
        id: mdbook-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-${{ steps.mdbook.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install mdBook
        if: steps.mdbook-cache.outputs.cache-hit != 'true'
        run: cargo install mdbook --version "=${{ steps.mdbook.outputs.version }}" --locked
      - name: Build the site, check its links, page footers and the CLI reference
        run: cargo xtask docs --check
      - name: Keep the built site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: target/docs/
          if-no-files-found: ignore
          retention-days: 14
