name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -q -p xtask -- data
      - run: cargo run -q -p openbrick -- check parts/ndn.logo-tile.obpart.json
      - run: cargo run -q -p openbrick -- check parts/ndn.nameplate-keychain.obpart.json

  test-cross:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo run -q -p openbrick -- standard

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the kernel WebAssembly probe
        run: cargo build --release --target wasm32-unknown-unknown -p openbrick-geom --example wasm_probe
      - name: Run the probe and check it matches the native fingerprint
        run: |
          out=$(node scripts/wasm-probe.mjs target/wasm32-unknown-unknown/release/examples/wasm_probe.wasm)
          echo "$out"
          native=$(cargo run -q --release -p openbrick-geom --example kernel_timing | awk '$1=="2x4"{print $5}')
          echo "native 2x4 fingerprint: $native"
          echo "$out" | grep -q "\"fingerprint\":\"$native\""

  deny:
    # Licence allowlist, bans, advisories and sources (LICENSE-POLICY.md, deny.toml).
    # Covers every feature, including the optional manifold-csg backend. The C++
    # sources that manifold-csg-sys clones at build time are outside Cargo's view;
    # see docs/spikes/q01b-manifold-csg-comparison.md.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features
          command: check

  geom-manifold-csg:
    # Second kernel backend (C++ Manifold through manifold-csg) and the
    # cross-backend conformance comparison; see
    # docs/spikes/q01b-manifold-csg-comparison.md. The first build clones Manifold
    # and Clipper2 from GitHub and compiles them with cmake and g++, which
    # ubuntu-24.04 runners already have; rust-cache keeps the build afterwards.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy with both kernel backends
        run: cargo clippy -p openbrick-geom --all-targets --features manifold-csg -- -D warnings
      - name: Conformance corpus on both backends
        run: cargo test -p openbrick-geom --features manifold-csg
      - name: Print the cross-backend comparison table
        run: cargo test -p openbrick-geom --features manifold-csg --test conformance backends_agree -- --nocapture
      - name: Corpus on manifold-csg alone
        run: cargo test -p openbrick-geom --no-default-features --features manifold-csg

  harness:
    # Device render harness (bench/harness): unit tests, including the results.csv
    # guard, and a headless smoke run. Smoke numbers are software rendering, never
    # device results. The committed meshes are checked against the kernel by cargo
    # test in the check job (crates/openbrick-geom/tests/harness_meshes.rs).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests, including the results.csv guard
        run: pnpm test
      - name: Install Chromium for the pinned Playwright (1.63.0)
        run: pnpm --dir bench/harness exec playwright install --with-deps chromium
      - name: Smoke test (software rendering, not a device result)
        run: pnpm --dir bench/harness smoke

  io-3mf:
    # 3MF and STL writers (crates/openbrick-io, backlog items 12 and 13, decision
    # D18). The write_fixtures example writes a kernel-built 2x4 brick with an
    # accent cube and a three-role fixture. lib3mf 2.5.0 (BSD-2-Clause, the 3MF
    # Consortium reference library) reads every file in strict mode; the script
    # re-derives every Production UUID from what lib3mf read and compares the
    # files with the example's manifest. --self-test checks that broken copies
    # fail for the reason they were built to show. lib3mf ships Linux wheels for
    # x86-64 only, so this job stays on ubuntu-24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lib3mf 2.5.0 (hash-pinned)
        run: python -m pip install --require-hashes -r scripts/requirements-validate-3mf.txt
      - name: Write the 3MF and STL fixtures
        run: cargo run -q --release -p openbrick-io --example write_fixtures -- target/io-fixtures
      - name: Validate the fixtures with lib3mf
        run: python -I scripts/validate-3mf.py --self-test target/io-fixtures/fixtures.json
      - name: The writers build for WebAssembly
        run: cargo build --release --target wasm32-unknown-unknown -p openbrick-io
      - name: Keep the fixtures for inspection in slicers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: io-fixtures
          path: target/io-fixtures/
          retention-days: 14

  web:
    # Browser pipeline (apps/web): the core as WebAssembly in a Web Worker and the
    # three.js viewer. Builds the core with the wasm-bindgen CLI pinned in
    # Cargo.lock (size budget, docs/plan/10 section 5) and runs every pnpm unit
    # test, including the real core in Node. Then the headless smoke test checks
    # that the browser's 2x4 and 2x2 equal the native kernel_timing values on
    # WebGL2 and WebGPU, that a slow 16x16 build is cancelled, and that the view
    # orbits under the brick; plus a phone-sized touch run. Smoke timings are
    # software rendering, never device results.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen version pinned in Cargo.lock
        id: wbg
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - name: Cache the wasm-bindgen CLI
        id: wbg-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.wbg.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install the wasm-bindgen CLI
        if: steps.wbg-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "=${{ steps.wbg.outputs.version }}" --locked
      - name: Clippy on wasm32 (the bindings exist only there)
        run: cargo clippy -p openbrick-wasm --target wasm32-unknown-unknown -- -D warnings
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the core (wasm-bindgen --target web, gzip size budget)
        run: cargo xtask wasm
      - name: Unit tests, including the real core in Node
        run: pnpm test
      - name: Install Chromium for the pinned Playwright (1.63.0)
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Smoke test (software rendering, not a device result)
        run: pnpm --dir apps/web smoke --screenshots smoke-screenshots
      - name: Keep what the smoke runs saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-screenshots
          path: apps/web/smoke-screenshots
          if-no-files-found: ignore

  part-exports:
    # Printable exports of the part crate, read back by lib3mf 2.5.0 in strict
    # mode (manifold and oriented meshes, traceability metadata, re-derived
    # Production UUIDs). relief.svg (backlog item 9): the 2x4 logo tile's body
    # and embossed relief (two touching objects) and its fused single-colour
    # object. Calibration coupon (backlog item 11, docs/plan/05 section 4): the
    # default fdm-0.4 coupon, the fdm-0.2 coupon (quantised 1.1 mm wall, deeper
    # pocket ribs) and the full pocket cross on a 256 x 256 mm bed. The
    # hostile-SVG tests (1 MiB stack, timed refusals) run with the workspace
    # tests. lib3mf ships Linux wheels for x86-64 only.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lib3mf 2.5.0 (hash-pinned)
        run: python -m pip install --require-hashes -r scripts/requirements-validate-3mf.txt
      - name: Write the logo tile exports
        run: |
          mkdir -p target/relief-exports
          OPENBRICK_RELIEF_EXPORT_DIR="$PWD/target/relief-exports" cargo test -q -p openbrick-part --test eval_relief relief_objects_export_as_closed_meshes
      - name: Build the coupons
        run: |
          cargo run -q --release -p openbrick-part --example coupon -- target/coupon
          cargo run -q --release -p openbrick-part --example coupon -- --process fdm-0.2 target/coupon
          cargo run -q --release -p openbrick-part --example coupon -- --pockets full --bed 256x256 target/coupon
      - name: Validate every export with lib3mf
        run: >-
          python -I scripts/validate-3mf.py
          target/relief-exports/logo-tile-two-colour.3mf target/relief-exports/logo-tile-fused.3mf
          target/coupon/coupon-fdm-0.4-cross.3mf target/coupon/coupon-fdm-0.2-cross.3mf target/coupon/coupon-fdm-0.4-full.3mf
      - name: The evaluator and the coupon build for WebAssembly
        run: cargo build --release --target wasm32-unknown-unknown -p openbrick-part
      - name: Release timing of the logo tile
        run: cargo run -q --release -p openbrick-part --example eval_timing -- 2x4:tile logo logo:deboss logo:inlay
      - name: Keep the exports for printing and slicer checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-exports
          path: |
            target/relief-exports/
            target/coupon/
          retention-days: 14

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check plan links
        run: |
          python3 - <<'EOF'
          import re,os,glob,sys
          bad=0
          for f in glob.glob('docs/plan/*.md')+glob.glob('docs/spikes/*.md'):
              for m in re.finditer(r'\]\(([^)]+)\)', open(f).read()):
                  t=m.group(1)
                  if t.startswith(('http','#')): continue
                  p=os.path.join(os.path.dirname(f), t.split