[workspace]
resolver = "2"
members = [
  "crates/openbrick-units",
  "crates/openbrick-geom",
  "crates/openbrick-part",
  "crates/openbrick-print",
  "crates/openbrick-engine",
  "crates/openbrick-catalog",
  "crates/openbrick-io",
  "crates/openbrick",
  "crates/openbrick-wasm",
  "crates/xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/NeuralDEEPnet/openBrick"
authors = ["OpenBrick3D contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse every float to the correctly rounded f64, as jsonschema
# (xtask) requires anyway; without it here, feature unification would make test
# builds parse floats differently from the shipped CLI and WebAssembly builds.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
# Content hashes of evaluated parts (docs/plan/06 section 10); pure Rust, builds for wasm32.
sha2 = { version = "0.10", default-features = false }
clap = { version = "4", features = ["derive"] }
# SVG artwork for relief.svg (docs/plan/06 section 5); Apache-2.0 OR MIT, pure Rust.
# No default features: no system fonts, no text shaping, no SVGZ, no writer, so it
# builds for wasm32-unknown-unknown. Pinned exactly: parsed artwork becomes
# geometry, and content hashes name the evaluator, not this crate.
usvg = { version = "=0.49.0", default-features = false }
# The CSS parser usvg uses (Apache-2.0 OR MIT, already in the tree through usvg),
# pinned to usvg's version: the artwork guards in openbrick-part read `<style>`
# rules the way usvg does, to follow url() references set by CSS and to bound
# usvg's selector matching before usvg runs.
simplecss = "=0.2.2"
# 2D fill rules and polygon booleans (openbrick-geom `region`); BSL-1.0, pure Rust,
# the Clipper2 port manifold-rust already uses for its cross-sections. Pinned
# exactly like the kernel, since its output becomes geometry.
clipper2-rust = "=1.2.0"
openbrick-units = { path = "crates/openbrick-units" }
openbrick-geom = { path = "crates/openbrick-geom" }
openbrick-part = { path = "crates/openbrick-part" }
openbrick-print = { path = "crates/openbrick-print" }
openbrick-engine = { path = "crates/openbrick-engine" }
openbrick-catalog = { path = "crates/openbrick-catalog" }
openbrick-io = { path = "crates/openbrick-io" }

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
