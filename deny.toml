[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "CC0-1.0", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "BSL-1.0"]
# MIT-0 is MIT without the attribution clause. Allowed only for this crate, which
# jsonschema needs (through referencing and fluent-uri) in the xtask dev tool.
exceptions = [{ allow = ["MIT-0"], crate = "borrow-or-share" }]

[bans]
multiple-versions = "warn"

[advisories]
unmaintained = "warn"
