[package]
name = "openbrick"
description = "OpenBrick3D command-line tool: build, validate, calibrate, convert, serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "openbrick"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde_json = { workspace = true }
openbrick-units = { workspace = true }
openbrick-geom = { workspace = true }
openbrick-part = { workspace = true }
openbrick-print = { workspace = true }
openbrick-io = { workspace = true }

[dev-dependencies]
# tests/cli.rs checks the --json output against schemas/report.schema.json and
# the recorded fit profile against schemas/fit-profile.schema.json. MIT, already
# in the tree through xtask, with the same features (no remote $ref fetching).
jsonschema = { version = "0.60.2", default-features = false }
# tests/export_parity.rs: the playground's export path (export_solids,
# export_part), natively, to check that the CLI writes the same meshes. A
# workspace crate; its wasm-bindgen dependency is for wasm32 only.
openbrick-wasm = { workspace = true }

[lints]
workspace = true
