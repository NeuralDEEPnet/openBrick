[package]
name = "openbrick-part"
description = "Parser and evaluator for openbrick/part@1 documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
openbrick-units = { workspace = true }
openbrick-geom = { workspace = true }
openbrick-print = { workspace = true }
# SVG artwork of relief.svg (src/eval/relief.rs), without fonts or image decoding.
usvg = { workspace = true }
# CSS rules of the artwork, read as usvg reads them (src/eval/svg.rs).
simplecss = { workspace = true }

[dev-dependencies]
# tests/eval_relief.rs writes the relief objects with the 3MF and STL writers,
# whose closed-mesh checks prove the objects touch without breaking a shell; the
# coupon example writes the coupon as 3MF and STL.
openbrick-io = { workspace = true }

[lints]
workspace = true
